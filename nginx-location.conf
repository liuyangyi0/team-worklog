location = /worklog { return 308 /worklog/; }
location ^~ /worklog/ {
    proxy_pass http://127.0.0.1:8766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    client_max_body_size 64k;
    proxy_read_timeout 30s;
    add_header X-Content-Type-Options nosniff always;

    # Binary chunks are streamed; ordinary JSON APIs keep the 64k limit.
    location ~ ^/worklog/api/uploads/[A-Za-z0-9_-]+/chunks/[0-9]+$ {
        client_max_body_size 5m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location ~ ^/worklog/api/(projects/[A-Za-z0-9_-]+/configurations|configurations/[A-Za-z0-9_-]+/versions)$ {
        client_max_body_size 4m;
    }
    location ~ ^/worklog/api/(projects/[A-Za-z0-9_-]+/credentials|credentials/[A-Za-z0-9_-]+)$ {
        client_max_body_size 256k;
    }
    location ~ ^/worklog/api/(documents/[A-Za-z0-9_-]+/versions/[A-Za-z0-9_-]+/(download|preview)|releases/[A-Za-z0-9_-]+/download)$ {
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
